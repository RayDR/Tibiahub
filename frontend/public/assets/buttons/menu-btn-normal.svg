<svg xmlns="http://www.w3.org/2000/svg" width="560" height="120" viewBox="0 0 560 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1220"></stop>
      <stop offset="1" stop-color="#070b14"></stop>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"></stop>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"></stop>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop>
    </linearGradient>

    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb300" stop-opacity="0"></stop>
      <stop offset="0.35" stop-color="#ffb300" stop-opacity="0.65"></stop>
      <stop offset="1" stop-color="#ffb300" stop-opacity="0"></stop>
    </linearGradient>

    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"></path>
    </pattern>

    <filter id="softShadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"></feDropShadow>
    </filter>
  </defs>

  <!-- Base rounded rect -->
  <rect x="8" y="10" width="544" height="100" rx="14" fill="url(#bg)" filter="url(#softShadow)"></rect>

  <!-- subtle border -->
  <rect x="8" y="10" width="544" height="100" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.06"></rect>

  <!-- grid texture -->
  <rect x="8" y="10" width="544" height="100" rx="14" fill="url(#grid)" opacity="0.55"></rect>

  <!-- top sheen -->
  <path d="M22 18H538c6 0 10 4 10 10v12H12V28c0-6 4-10 10-10z" fill="url(#sheen)"></path>

  <!-- gold accent line (left -> right) -->
  <rect x="24" y="96" width="512" height="2" fill="url(#goldLine)" opacity="0.9"></rect>

  <!-- left notch accent -->
  <path d="M18 30c0-6 4-10 10-10h14l10 12-10 12H28c-6 0-10-4-10-10z" fill="#ffb300" opacity="0.10"></path>
</svg>
