<svg xmlns="http://www.w3.org/2000/svg" width="560" height="120" viewBox="0 0 560 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e1a2f"></stop>
      <stop offset="1" stop-color="#0a1122"></stop>
    </linearGradient>

    <radialGradient id="glow" cx="22%" cy="50%" r="75%">
      <stop offset="0" stop-color="#ffb300" stop-opacity="0.26"></stop>
      <stop offset="0.45" stop-color="#ffb300" stop-opacity="0.10"></stop>
      <stop offset="1" stop-color="#ffb300" stop-opacity="0"></stop>
    </radialGradient>

    <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb300" stop-opacity="0.35"></stop>
      <stop offset="0.5" stop-color="#ffcc66" stop-opacity="0.95"></stop>
      <stop offset="1" stop-color="#ffb300" stop-opacity="0.35"></stop>
    </linearGradient>

    <filter id="inner" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="0"></feOffset>
      <feGaussianBlur stdDeviation="6" result="blur"></feGaussianBlur>
      <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
    </filter>
  </defs>

  <rect x="8" y="10" width="544" height="100" rx="14" fill="url(#bg)"></rect>
  <rect x="8" y="10" width="544" height="100" rx="14" fill="url(#glow)"></rect>

  <!-- strong border -->
  <rect x="8" y="10" width="544" height="100" rx="14" fill="none" stroke="url(#goldStroke)" stroke-width="2.5"></rect>

  <!-- left bar -->
  <rect x="18" y="18" width="8" height="84" rx="4" fill="#ffb300" opacity="0.9"></rect>

  <!-- subtle inner highlight -->
  <path d="M22 18H538c8 0 14 6 14 14v10H8V32c0-8 6-14 14-14z" fill="#ffffff" opacity="0.05" filter="url(#inner)"></path>
</svg>
