<svg xmlns="http://www.w3.org/2000/svg" width="560" height="120" viewBox="0 0 560 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c1628"></stop>
      <stop offset="1" stop-color="#080e1c"></stop>
    </linearGradient>

    <radialGradient id="glow" cx="18%" cy="50%" r="70%">
      <stop offset="0" stop-color="#ffb300" stop-opacity="0.18"></stop>
      <stop offset="0.45" stop-color="#ffb300" stop-opacity="0.06"></stop>
      <stop offset="1" stop-color="#ffb300" stop-opacity="0"></stop>
    </radialGradient>

    <linearGradient id="goldEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcc66" stop-opacity="0.55"></stop>
      <stop offset="1" stop-color="#ffb300" stop-opacity="0.10"></stop>
    </linearGradient>

    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"></circle>
    </pattern>

    <filter id="softShadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.55"></feDropShadow>
    </filter>
  </defs>

  <rect x="8" y="10" width="544" height="100" rx="14" fill="url(#bg)" filter="url(#softShadow)"></rect>
  <rect x="8" y="10" width="544" height="100" rx="14" fill="url(#glow)"></rect>

  <!-- border + gold edge -->
  <rect x="8" y="10" width="544" height="100" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.07"></rect>
  <rect x="10" y="12" width="540" height="96" rx="13" fill="none" stroke="url(#goldEdge)" stroke-width="2" opacity="0.8"></rect>

  <!-- texture -->
  <rect x="8" y="10" width="544" height="100" rx="14" fill="url(#dots)" opacity="0.8"></rect>

  <!-- left highlight bar -->
  <rect x="18" y="22" width="6" height="76" rx="3" fill="#ffb300" opacity="0.55"></rect>
</svg>
