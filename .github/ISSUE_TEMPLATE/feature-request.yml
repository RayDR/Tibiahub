name: Feature request
description: Suggest a product or community improvement.
title: "[Suggestion] "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Player need
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
      description: Explain the experience you would like TibiaHub to provide.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional context about other approaches.
